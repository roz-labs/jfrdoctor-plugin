name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The plugin ships source only; a jar, class file or other binary (or a
      # file over 256 KiB) would put every version back on reviewer hold.
      - name: Verify plugin files are readable source
        run: ./ci/check-plugin-files.sh

      - name: Verify version sync (plugin.json / McpServer.java)
        run: ./ci/check-version-sync.sh

      - name: Run unit tests (JSON parser/writer, JVM-argument sanitizer, redaction, read loop)
        run: ./test/unit.sh

      - name: Generate demo recording
        run: ./samples/gen-sample.sh

      - name: Verify no recording leaks host data
        run: ./ci/check-sample-privacy.sh

      # Starts the server exactly as the plugin manifest does — the launcher
      # compiling src/ at startup — so this also catches compile errors.
      - name: Run smoke tests (protocol, malformed input, all 9 tools over stdio)
        run: ./test/smoke.sh

      # Records a workload full of secrets, an email, URL credentials, a
      # home-directory path and a raw IP, and asserts none reach tool output.
      - name: Run redaction tests (every SECURITY.md promise, on a real recording)
        run: ./test/redaction.sh

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      - name: Verify no network and no file writes (strace)
        run: ./test/no-egress.sh

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # The same manifest validation the marketplace submission pipeline runs.
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
