name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serializes Release runs so two near-simultaneous CI completions for the
# same version can't both pass the idempotency check before either has
# created the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # workflow_run fires on every completion regardless of pass/fail, so we
    # must gate on conclusion explicitly. head_branch alone is NOT enough: for
    # a pull_request-triggered CI run it is the PR's source branch name, and a
    # fork can call its branch `main`. Only a push to this repository's own
    # main may release, so the event and the head repository are checked too.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    steps:
      # Check out the EXACT commit CI validated, not whatever main HEAD is
      # by the time this job runs — main may have moved further already.
      - name: Checkout commit CI passed on
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Mirrors ci/check-version-sync.sh, which treats plugin.json as the
      # authoritative version.
      - name: Extract version from plugin.json
        id: version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # The token is given only to the two steps that call gh, never to the
      # repository's own scripts.
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release $TAG found yet — will create it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Cheap safety re-checks before tagging. No JDK needed — CI already
      # compiled and exercised this exact commit; these re-assert the two
      # properties that matter for a *release* specifically: the plugin ships
      # only readable source, and the version declarations agree.
      - name: Re-verify plugin files are readable source
        if: steps.check.outputs.exists == 'false'
        run: ./ci/check-plugin-files.sh

      - name: Re-verify version sync
        if: steps.check.outputs.exists == 'false'
        run: ./ci/check-version-sync.sh

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          NOTES="$(cat <<'EOF'
          ## Install

          ```
          /plugin marketplace add roz-labs/jfrdoctor-plugin
          /plugin install jfrdoc@roz-labs
          ```

          ## Requirements

          - JDK 21+ on PATH
          EOF
          )"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "jfrdoc ${{ steps.version.outputs.version }}" \
            --notes "$NOTES" \
            --generate-notes
